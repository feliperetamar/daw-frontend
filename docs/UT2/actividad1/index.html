<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Calificación de nota</title>
  </head>
  <body>
    <h1>Calculadora de calificación</h1>

    <form id="formulario">
      <label for="notaInput"
        >Introduce una nota (entre 0 y 10, puede tener decimales):</label
      >
      <input
        type="number"
        id="notaInput"
        min="0"
        max="10"
        step="0.01"
        required
      />
      <button type="submit">Calcular calificación</button>
    </form>

    <!-- Párrafo donde se mostrará el resultado -->
    <p id="resultado"></p>

    <script src="js/main.js"></script>
  </body>
</html>
